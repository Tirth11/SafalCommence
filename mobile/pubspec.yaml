name: safalmarkethub
description: SafalMarketHub customer app — UI mockup.
publish_to: "none"
version: 0.1.0

environment:
  sdk: ">=3.4.0 <4.0.0"

# Deliberately no third-party packages. Everything here is Flutter SDK only,
# so the mockup runs after a plain `flutter pub get` with nothing to resolve.
dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
